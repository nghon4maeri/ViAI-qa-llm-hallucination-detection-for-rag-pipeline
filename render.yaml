# render.yaml - 1-Click Blueprint Deployment for ViAI-QA
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI ViAI-QA Backend API
  - type: web
    name: viai-qa-backend
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements-serving.txt && alembic upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viai-qa-db
          property: connectionString
      - key: DISABLE_MODEL
        value: "true"
      - key: ENABLE_TRACING
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: MODEL_VERSION
        value: "1.0.0"

  # 2. SvelteKit ViAI-QA Frontend Workspace
  - type: web
    name: viai-qa-frontend
    runtime: node
    rootDir: frontend
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node build
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: viai-qa-backend
          property: url
      - key: NODE_VERSION
        value: 20.11.0

databases:
  # 3. Managed PostgreSQL Database
  - name: viai-qa-db
    region: singapore
    plan: free
    databaseName: viai_qa
    user: viai_user
