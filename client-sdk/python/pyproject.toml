[project]
name = "viai-qa"
version = "0.1.0"
description = "Client for the ViAI-QA RAG evaluation API, plus an MCP server"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
viai-qa-mcp = "viai_qa.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viai_qa"]
