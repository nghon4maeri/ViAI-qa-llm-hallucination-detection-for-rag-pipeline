# dvc.yaml
stages:
  embed:
    cmd: python ml/pipelines/embed.py
    deps:
      - ml/pipelines/embed.py
      - data/vihallu-dataset/vihallu-train.csv
    outs:
      - features/phobert_embeddings.npy

  train:
    cmd: python ml/pipelines/train.py
    deps:
      - ml/pipelines/train.py
      - features/phobert_embeddings.npy
      - data/vihallu-dataset/vihallu-train.csv
      - data/vihallu-vistral-dataset/vistral_train_predictions_with_probs.csv
    outs:
      - models/lgbm
      - models/metadata.yaml
      - models/feature_schema.json

  infer:
    cmd: python ml/pipelines/infer.py
    deps:
      - ml/pipelines/infer.py
      - features/phobert_embeddings.npy
      - data/vihallu-dataset/vihallu-train.csv
      - data/vihallu-vistral-dataset/vistral_train_predictions_with_probs.csv
      - models/lgbm
      - models/feature_schema.json
    outs:
      - predictions/vihallu_infer_predictions.csv

  promote:
    cmd: python ml/pipelines/promote.py
    deps:
      - ml/pipelines/promote.py
      - models/metadata.yaml
    always_changed: true