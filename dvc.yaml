# dvc.yaml
stages:
  build_medical:
    cmd: python machine-learning/pipelines/build_medical_hallu.py
    params:
      - machine-learning/params.yaml:
          - medical
    deps:
      - machine-learning/pipelines/build_medical_hallu.py
      - data/raw/vimedaqa
    outs:
      - data/processed/vimedhallu

  embed:
    cmd: python machine-learning/pipelines/embed.py
    params:
      - machine-learning/params.yaml:
          - embed
    deps:
      - machine-learning/pipelines/embed.py
      - data/raw/vihallu/vihallu-train.csv
    outs:
      - artifacts/features/phobert_embeddings.npy

  train:
    cmd: python machine-learning/pipelines/train.py
    params:
      - machine-learning/params.yaml:
          - train
    deps:
      - machine-learning/pipelines/train.py
      - artifacts/features/phobert_embeddings.npy
      - data/raw/vihallu/vihallu-train.csv
      - data/raw/vihallu-vistral/vistral_train_predictions_with_probs.csv
    outs:
      - artifacts/models/lgbm
      - artifacts/models/metadata.yaml
      - artifacts/models/feature_schema.json

  infer:
    cmd: python machine-learning/pipelines/infer.py
    deps:
      - machine-learning/pipelines/infer.py
      - artifacts/features/phobert_embeddings.npy
      - data/raw/vihallu/vihallu-train.csv
      - data/raw/vihallu-vistral/vistral_train_predictions_with_probs.csv
      - artifacts/models/lgbm
      - artifacts/models/feature_schema.json
    outs:
      - artifacts/predictions/vihallu_infer_predictions.csv

  # Reviewer feedback from Postgres (needs DATABASE_URL); re-run before each retraining round
  export_feedback:
    cmd: python machine-learning/pipelines/export_feedback.py
    deps:
      - machine-learning/pipelines/export_feedback.py
    outs:
      - data/processed/feedback/feedback-export.csv
    always_changed: true

  promote:
    cmd: python machine-learning/pipelines/promote.py
    deps:
      - machine-learning/pipelines/promote.py
      - artifacts/models/metadata.yaml
    always_changed: true