name: CI Pipeline

on:
  push:
    branches:
      - "feature*"
      - main
  pull_request:
    branches:
      - main

# A newer push to the same branch supersedes the running pipeline
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # a package GITHUB_TOKEN creates is linked to this repo; ghcr.io/<owner>/hallucination-backend already
  # exists from the old repo (pushed with a PAT), so the workflow token is denied there
  IMAGE_NAME: ${{ github.repository_owner }}/viai-qa-backend
  # the version the CI-only environment (requirements/ci.txt) is verified on
  PYTHON_VERSION: "3.12"

# CI runs on GitHub-hosted runners (free for this public repo), so it does not depend on a
# self-hosted machine being online. Only the Jenkins trigger needs the self-hosted runner,
# because Jenkins lives on that machine.
jobs:
  test:
    name: Unit Test & Quality Gate
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements/ci.txt

      # Rust TF-IDF index (docs/GO_RUST_MIGRATION_PLAN.md R1); the runner image ships cargo, and the
      # parity tests in tests/demo compare it with scikit-learn
      - name: Build the Rust extension (viai_text)
        run: pip install ./machine-learning/viai_text

      # No model weights in CI: DISABLE_MODEL uses the mock engine; ML-stack tests skip themselves
      - name: Run unit & integration tests with coverage
        env:
          DISABLE_MODEL: "true"
        run: |
          pytest tests \
            --cov=backend \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1))
          ")
          echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Coverage: ${COVERAGE}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  web:
    name: Web (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: applications/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  packages:
    name: Python packages install and import
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Installs the two packages the way users and images do, from their own pyproject.toml
      - name: Install vihallu-features and viai-qa[mcp] in a clean venv
        run: |
          python -m venv .venv_packages
          . .venv_packages/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet ./machine-learning "./client-sdk/python[mcp]"
          python -c "import vihallu_features as vf; assert vf.FEATURE_DIM == 778"
          python -c "import viai_qa, viai_qa.mcp_server; print('viai_qa', viai_qa.ViaiQA)"
          command -v viai-qa-mcp

  deployctl:
    name: deployctl (Go k8s orchestration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/k8s/deployctl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: infrastructure/k8s/deployctl/go.mod
          cache: false   # standard library only, nothing to cache

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        run: |
          go vet ./...
          go test -count=1 -cover ./...

      - name: Build
        run: go build -o deployctl . && ./deployctl --help 2>&1 | head -3

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, web, packages, deployctl]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the workflow's own GITHUB_TOKEN
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      # torch + transformers make a multi-GB image; the hosted runner needs the room
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Model weights are not baked in here: artifacts/models only holds DVC pointers in git.
      # The served model comes from the MLflow registry via KServe (storageUri), not this image.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Output image info
        run: |
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # CD to GKE is switched off until the cluster has budget again: set the repository variable
  # ENABLE_CD=true (Settings > Variables > Actions) to turn the Jenkins trigger back on.
  trigger-deploy:
    name: Trigger Jenkins CD
    runs-on: self-hosted   # Jenkins runs on the self-hosted machine
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_CD == 'true'
    permissions:
      contents: write   # commit comment

    steps:
      - name: Trigger Jenkins deployment
        run: |
          curl -f -X POST \
            "${{ secrets.JENKINS_URL }}/job/hallucination-cd/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "IMAGE_TAG=${{ needs.build.outputs.short_sha }}" \
            --data-urlencode "GIT_SHA=${{ github.sha }}" \
            --data-urlencode "GIT_BRANCH=${{ github.ref_name }}" \
            --data-urlencode "TRIGGERED_BY=github-actions"
          echo "Jenkins CD triggered with IMAGE_TAG=${{ needs.build.outputs.short_sha }}"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `**CD Pipeline Triggered**\n- Image: \`ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short_sha }}\`\n- Jenkins: ${{ secrets.JENKINS_URL }}/job/hallucination-cd/`
            })
