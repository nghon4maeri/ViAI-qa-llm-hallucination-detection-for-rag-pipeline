apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.artifacts.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow                      # MLFLOW_TRACKING_URI http://mlflow.<ns>.svc.cluster.local:5000
spec:
  selector: {app: mlflow}
  ports:
    - {name: http, port: 5000, targetPort: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: DB_HOST, value: {{ .Values.db.host | quote }}}
            - {name: DB_NAME, value: {{ .Values.db.name | quote }}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.db.credentialsSecret }}, key: POSTGRES_USER}}
            - name: DB_PASS
              valueFrom: {secretKeyRef: {name: {{ .Values.db.credentialsSecret }}, key: POSTGRES_PASSWORD}}
            - {name: MLFLOW_WORKERS, value: {{ .Values.workers | quote }}}
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: artifacts, mountPath: /mlflow/artifacts}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: mlflow-artifacts}
