apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: mlflow-runtime
spec:
  supportedModelFormats:
    - name: mlflow
      version: "1"
      autoSelect: true
  protocolVersions:
    - v2
  containers:
    - name: kserve-container
      image: {{ .Values.image }}
      env:
        - {name: MLSERVER_HTTP_PORT, value: "8080"}
        - {name: MLSERVER_GRPC_PORT, value: "8081"}
        - {name: MLSERVER_MODEL_IMPLEMENTATION, value: "mlserver_mlflow.MLflowRuntime"}
        - {name: MLSERVER_MODEL_URI, value: "/mnt/models"}
        - {name: MLSERVER_MODEL_NAME, value: {{ .Values.modelName | quote }}}
        - {name: MLFLOW_S3_IGNORE_TLS, value: "true"}
        - {name: AWS_DEFAULT_REGION, value: "ap-southeast-1"}
      resources: {{- toYaml .Values.resources | nindent 8 }}
